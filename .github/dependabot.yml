version: 2
updates:
  # npm-Abhängigkeiten (package.json) — wöchentlich, gruppiert nach
  # Major-Frameworks, damit z.B. React 19 & Next 16 nicht dutzendfach
  # einzelne PRs erzeugen.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      dev-dependencies:
        dependency-type: "development"
        # Major-Sprünge (z. B. vitest 5, jsdom 30) einzeln prüfen: gebündelt
        # brechen sie `npm ci` (Peer-Konflikte) und blockieren die ganze Gruppe.
        update-types:
          - "minor"
          - "patch"
    # Major-Version-Bumps für Build-kritische Pakete manuell steuern:
    # TypeScript 6→7 und @types/node 20→26 würden sofort Build-Fehler
    # erzeugen, da Breaking Changes im Compiler und in den Node-Typen
    # umfangreiche Code-Anpassungen erfordern.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "imapflow"
        update-types: ["version-update:semver-major"]

  # GitHub Actions Workflow-Versionen (z.B. actions/checkout, actions/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
