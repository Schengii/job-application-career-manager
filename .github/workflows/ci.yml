name: CI

# Lint, Testsuite (Vitest), Produktions-Build und E2E-Tests (Playwright) bei
# jedem Push/PR auf main. Das README verspricht diese Pipeline bereits
# ("CI/CD | GitHub Actions (.github/workflows/ci.yml)") — dies ist die
# tatsächliche Umsetzung davon.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'

# Verhindert, dass mehrere Läufe für denselben Branch/PR gleichzeitig laufen —
# ein neuer Push auf denselben PR bricht den vorherigen, noch laufenden Job ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Platzhalter fuer Lint/Build: Das Projekt nutzt PostgreSQL (Neon) statt
  # SQLite, daher eine URL im PostgreSQL-Format. Fuer echte Datenbank-Laeufe
  # (Vitest mit TEST_DATABASE_URL, Playwright mit E2E_DATABASE_URL) muss eine
  # erreichbare Neon-Branch bereitgestellt werden.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Testsuite (Vitest)
        run: npm run test

      - name: Produktions-Build
        run: npm run build

  e2e:
    name: E2E-Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      # Nur Chromium (siehe Begründung in playwright.config.mts) — spart
      # Download-/Laufzeit gegenüber allen drei Playwright-Browsern.
      - name: Playwright-Browser (Chromium) installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests (Playwright)
        run: npm run test:e2e

      - name: Playwright-Report bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    # Verifiziert nur, dass das mehrstufige Dockerfile (siehe README, Abschnitt
    # "Schnellstart & Setup" -> Docker) tatsächlich baut — kein Push, kein
    # Registry-Login nötig. ubuntu-latest bringt Docker bereits vorinstalliert
    # mit, unabhängig von der lokalen Docker-Desktop-Installation der
    # Entwickler:innen.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen (mit GitHub-Actions-Cache für die Build-Layer)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: job-career-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
