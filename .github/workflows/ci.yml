name: CI

# Lint, Testsuite (Vitest), Produktions-Build und E2E-Tests (Playwright) bei
# jedem Push/PR auf main. Das README verspricht diese Pipeline bereits
# ("CI/CD | GitHub Actions (.github/workflows/ci.yml)") — dies ist die
# tatsächliche Umsetzung davon.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'

# Verhindert, dass mehrere Läufe für denselben Branch/PR gleichzeitig laufen —
# ein neuer Push auf denselben PR bricht den vorherigen, noch laufenden Job ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Platzhalter-URL nur für `prisma generate` und `next build` — der Build
  # verbindet sich nicht mit der Datenbank.
  DATABASE_URL: "postgresql://build:build@localhost:5432/build"

# Datenbankabhängige Schritte (Vitest-Integrationstests, Playwright-E2E)
# brauchen eine echte Neon-PostgreSQL-Datenbank, z. B. eine eigene Test-Branch
# in Neon. Die App nutzt den Neon-HTTP-Adapter; eine einfache Postgres-
# Instanz im Runner funktioniert daher nicht. Verbindungs-URL als Repository-
# Secret `TEST_DATABASE_URL` hinterlegen (Settings → Secrets and variables →
# Actions). Ohne das Secret (und bei Dependabot-/Fork-PRs, die keine Secrets
# sehen) werden diese Schritte mit einer Warnung übersprungen; Lint, Build und
# Docker-Build laufen immer.

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Hinweis zu fehlendem Test-Datenbank-Secret
        if: env.TEST_DATABASE_URL == ''
        run: echo "::warning::TEST_DATABASE_URL ist nicht gesetzt - Vitest-Integrationstests werden übersprungen, Unit-Tests werden ausgeführt."

      - name: Unit-Tests (Vitest, ohne Datenbank)
        if: env.TEST_DATABASE_URL == ''
        run: npm run test:unit

      - name: Testsuite (Vitest, inkl. Integrationstests)
        if: env.TEST_DATABASE_URL != ''
        run: npm run test

      - name: Produktions-Build
        run: npm run build

  e2e:
    name: E2E-Tests (Playwright)
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Hinweis zu fehlendem Test-Datenbank-Secret
        if: env.TEST_DATABASE_URL == ''
        run: echo "::warning::TEST_DATABASE_URL ist nicht gesetzt - E2E-Tests werden übersprungen."

      - name: Checkout
        if: env.TEST_DATABASE_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        if: env.TEST_DATABASE_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Abhängigkeiten installieren
        if: env.TEST_DATABASE_URL != ''
        run: npm ci

      - name: Prisma Client generieren
        if: env.TEST_DATABASE_URL != ''
        run: npx prisma generate

      # Nur Chromium (siehe Begründung in playwright.config.mts).
      - name: Playwright-Browser (Chromium) installieren
        if: env.TEST_DATABASE_URL != ''
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests (Playwright)
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Playwright-Report bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    # Verifiziert nur, dass das mehrstufige Dockerfile (siehe README, Abschnitt
    # "Schnellstart & Setup" -> Docker) tatsächlich baut — kein Push, kein
    # Registry-Login nötig. ubuntu-latest bringt Docker bereits vorinstalliert
    # mit, unabhängig von der lokalen Docker-Desktop-Installation der
    # Entwickler:innen.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bauen (mit GitHub-Actions-Cache für die Build-Layer)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: job-career-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
