name: CI

# Lint, Testsuite (Vitest) und Produktions-Build bei jedem Push/PR auf main.
# Das README verspricht diese Pipeline bereits ("CI/CD | GitHub Actions
# (.github/workflows/ci.yml)") — dies ist die tatsächliche Umsetzung davon.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verhindert, dass mehrere Läufe für denselben Branch/PR gleichzeitig laufen —
# ein neuer Push auf denselben PR bricht den vorherigen, noch laufenden Job ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQLite-Datei nur für den Build-Schritt (next build) — die eigentliche
  # Testsuite verwendet eine eigene, isolierte Testdatenbank, siehe
  # vitest.global-setup.ts.
  DATABASE_URL: "file:./ci.db"

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Testsuite (Vitest)
        run: npm run test

      - name: Produktions-Build
        run: npm run build
