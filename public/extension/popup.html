<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Manager Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 3px; }
    .field input, .field textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    .field textarea { resize: none; height: 48px; }
    .field input:focus, .field textarea:focus { outline: none; border-color: #38bdf8; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 9px; background: #0284c7; hover: #0369a1; border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 6px; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 11px; text-align: center; min-height: 16px; }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    .quick-open { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: #38bdf8; text-decoration: none; }
    .quick-open:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🚀</span> Career Manager
    </div>
    <span class="badge" id="host-badge">localhost:3000</span>
  </div>

  <div id="form-container">
    <div class="field">
      <label for="job-title">Job-Titel</label>
      <input type="text" id="job-title" placeholder="Wird geladen..." />
    </div>

    <div class="field">
      <label for="company-name">Unternehmen</label>
      <input type="text" id="company-name" placeholder="Unternehmen" />
    </div>

    <div class="row">
      <div class="field">
        <label for="location">Standort</label>
        <input type="text" id="location" placeholder="z.B. Bonn" />
      </div>
      <div class="field">
        <label for="remote">Remote?</label>
        <input type="text" id="remote" placeholder="Ja / Nein" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="contact-name">Ansprechpartner</label>
        <input type="text" id="contact-name" placeholder="z.B. Hr. Schmidt" />
      </div>
      <div class="field">
        <label for="contact-email">Recruiter E-Mail</label>
        <input type="text" id="contact-email" placeholder="jobs@..." />
      </div>
    </div>

    <div class="field">
      <label for="tech-stack">Tech-Stack</label>
      <input type="text" id="tech-stack" placeholder="React, TypeScript, CSS" />
    </div>

    <button id="save-btn" class="btn">Im Dashboard speichern ⚡</button>
    <div id="status" class="status"></div>
    <a href="http://localhost:3000/jobs" target="_blank" class="quick-open">Zum Dashboard wechseln →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
